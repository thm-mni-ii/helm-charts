{{ if .Values.collab.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collab
  labels:
    app: {{ .Release.Name }}-collab
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-collab
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-collab
    spec:
      containers:
      - name: {{ .Release.Name }}-collab
        image: {{ include "fbs-collab-image" . }}
        imagePullPolicy: {{ .Values.collab.image.pullPolicy }}
        ports:
        - containerPort: 1234
          name: http
        env:
          - name: FBS_ROOT_URL
            value: https://{{ .Release.Name }}-core:443
          - name: OIDC_ISSUER
            value: {{ include "oidc-issuer" . | quote }}
          - name: OIDC_JWK_SET_URI
            value: {{ include "oidc-jwk-set-uri" . | quote }}
          - name: NODE_TLS_REJECT_UNAUTHORIZED
            value: "0"
        resources:
          requests:
            cpu: {{ .Values.collab.resources.cpu.request }}
            memory: {{ .Values.collab.resources.memory.request }}
          limits:
            cpu: {{ .Values.collab.resources.cpu.limit }}
            memory: {{ .Values.collab.resources.memory.limit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collab
  labels:
    app: {{ .Release.Name }}-collab
spec:
  selector:
    app: {{ .Release.Name }}-collab
  ports:
    - name: http
      protocol: TCP
      port: 1234
      targetPort: 1234
{{ if .Values.collab.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-collab
  labels:
    app: {{ .Release.Name }}-collab
  {{- with .Values.collab.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.collab.ingress.className }}
  ingressClassName: {{ .Values.collab.ingress.className }}
  {{- end }}
  {{- if .Values.collab.ingress.tls }}
  tls:
    {{- toYaml .Values.collab.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.collab.ingress.hosts }}
    {{- range .Values.collab.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-collab
                port:
                  number: 1234
        {{- end }}
    {{- end }}
  {{- else }}
    - host: {{ .Values.common.config.hostname | quote }}
      http:
        paths:
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-collab
                port:
                  number: 1234
  {{- end }}
{{ end }}
{{ if .Values.collab.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-collab-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /collab
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-collab
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.common.config.hostname }}`) && Path(`/collab`)
    kind: Rule
    services:
    - name: {{ .Release.Name }}-collab
      port: 1234
    middlewares:
    - name: {{ .Release.Name }}-collab-strip-prefix
{{ end }}
{{ end }}
