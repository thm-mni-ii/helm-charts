{{ if .Values.eat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eat
  labels:
    app: {{ .Release.Name }}-eat
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-eat
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-eat
    spec:
      containers:
      - name: {{ .Release.Name }}-eat
        image: {{ include "fbs-eat-image" . }}
        imagePullPolicy: {{ .Values.eat.image.pullPolicy }}
        ports:
        - containerPort: 8050
          name: http
        env:
          - name: URL_BASE_PATH
            value: /eat/
          - name: FBS_BASE_URL
            value: https://{{ .Release.Name }}-core
          - name: FBS_TLS_NO_VERIFY
            value: "true"
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-core
                key: jwtSecret
          - name: OIDC_ISSUER
            value: {{ include "oidc-issuer" . | quote }}
          - name: OIDC_JWK_SET_URI
            value: {{ include "oidc-jwk-set-uri" . | quote }}
          - name: SERVER_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-eat
                key: sessionSecret
          {{ if .Values.runner.sqlChecker.enabled }}
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-sql-checker
                key: mongodbUri
          {{ else }}
            {{ fail "eat requires that the sql-checker is enabled" }}
          {{ end }}
          - name: MONGODB_PLAYGROUND_URL
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-playground-mongodb
                key: mongodbUri
        resources:
          requests:
            cpu: {{ .Values.eat.resources.cpu.request }}
            memory: {{ .Values.eat.resources.memory.request }}
          limits:
            cpu: {{ .Values.eat.resources.cpu.limit }}
            memory: {{ .Values.eat.resources.memory.limit }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Release.Name }}-eat
data:
  sessionSecret: {{ .Values.eat.config.sessionSecret | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-eat
  labels:
    app: {{ .Release.Name }}-eat
spec:
  selector:
    app: {{ .Release.Name }}-eat
  ports:
    - name: http
      protocol: TCP
      port: 8050
      targetPort: 8050
{{ if .Values.eat.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-eat
  labels:
    app: {{ .Release.Name }}-eat
  {{- with .Values.eat.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.eat.ingress.className }}
  ingressClassName: {{ .Values.eat.ingress.className }}
  {{- end }}
  {{- if .Values.eat.ingress.tls }}
  tls:
    {{- toYaml .Values.eat.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.eat.ingress.hosts }}
    {{- range .Values.eat.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-eat
                port:
                  number: 8050
        {{- end }}
    {{- end }}
  {{- else }}
    - host: {{ .Values.common.config.hostname | quote }}
      http:
        paths:
          - path: /eat
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-eat
                port:
                  number: 8050
  {{- end }}
{{ end }}
{{ if .Values.eat.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-eat-redirect
spec:
  redirectRegex:
    regex: ^(.*)/eat$
    replacement: ${1}/eat/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-eat-redirect
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.common.config.hostname }}`) && Path(`/eat`)
    kind: Rule
    services:
    - name: {{ .Release.Name }}-eat
      port: 8050
    middlewares:
      - name: {{ .Release.Name }}-eat-redirect
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-eat
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.common.config.hostname }}`) && PathPrefix(`/eat/`)
    kind: Rule
    services:
    - name: {{ .Release.Name }}-eat
      port: 8050
{{ end }}
{{ end }}
