{{ if .Values.webShell.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-shell-nginx
data:
  default.conf: |-
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # SPA callback route for OIDC authorization code flow
        location ^~ /oauth2/callback {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy for identity-service APIs
        location /api/v2/application-providers {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/api/v2/application-providers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2/admin/application-providers {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/api/v2/admin/application-providers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/legal/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/api/v1/legal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy for core APIs (e.g. /api/v2/playground, /api/v1/courses)
        location /api/ {
            proxy_pass https://{{ .Release.Name }}-core:443/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
        }

        location /graphql {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/oauth2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/.well-known/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /connect/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/connect/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /logout {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /saml2/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/saml2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /legal/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/legal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /css/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/css/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /js/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/js/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /images/ {
            proxy_pass http://{{ .Release.Name }}-identity-service:8080/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web-shell
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web-shell
    spec:
      containers:
      - name: {{ .Release.Name }}-web-shell
        image: {{ include "fbs-web-shell-image" . }}
        imagePullPolicy: {{ .Values.webShell.image.pullPolicy }}
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: {{ .Values.webShell.resources.cpu.request }}
            memory: {{ .Values.webShell.resources.memory.request }}
          limits:
            cpu: {{ .Values.webShell.resources.cpu.limit }}
            memory: {{ .Values.webShell.resources.memory.limit }}
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: {{ .Release.Name }}-web-shell-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
spec:
  selector:
    app: {{ .Release.Name }}-web-shell
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
{{ if .Values.webShell.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
  {{- with .Values.webShell.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.webShell.ingress.className }}
  ingressClassName: {{ .Values.webShell.ingress.className }}
  {{- end }}
  {{- if .Values.webShell.ingress.tls }}
  tls:
    {{- toYaml .Values.webShell.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.webShell.ingress.hosts }}
    {{- range .Values.webShell.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-web-shell
                port:
                  number: 80
        {{- end }}
    {{- end }}
  {{- else }}
    - host: {{ .Values.common.config.hostname | quote }}
      http:
        paths:
          - path: /oauth2/callback
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-shell
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-shell
                port:
                  number: 80
  {{- end }}
{{ end }}
{{ if .Values.webShell.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-web-shell
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.common.config.hostname }}`)
    kind: Rule
    services:
    - name: {{ .Release.Name }}-web-shell
      port: 80
{{ end }}
{{ end }}
