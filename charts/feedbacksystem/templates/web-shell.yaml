{{ if .Values.webShell.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-shell-caddy
data:
  Caddyfile: |-
    :80 {
        root * /usr/share/caddy

        header {
            -Server
        }

        # Reverse proxy for Course Management frontend (Angular SPA)
        handle /course-management {
            redir /course-management/ 301
        }
        handle /course-management/* {
            reverse_proxy http://{{ .Release.Name }}-course-management-web:80
        }

        # Reverse proxy for SQL Playground frontend (Angular SPA)
        handle /sql-playground {
            redir /sql-playground/ 301
        }
        handle /sql-playground/* {
            reverse_proxy http://{{ .Release.Name }}-sql-playground-web:80
        }

        # Reverse proxy for identity-service APIs
        handle /api/v2/application-providers* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /api/v2/admin/application-providers* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /api/v1/auth/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /api/v1/legal/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /graphql* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        # SPA callback route for OIDC authorization code flow (must be handled by Web Shell SPA)
        @oauth2Callback {
            path /oauth2/callback /oauth2/callback/*
        }
        handle @oauth2Callback {
            header {
                X-Frame-Options "SAMEORIGIN"
                Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' http: https: blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';"
                Cache-Control "no-store, no-cache, must-revalidate"
            }
            try_files {path} /index.html
            file_server
        }

        # Reverse proxy for identity-service OAuth2 endpoints (authorize, token, jwks, userinfo, etc.)
        @oauth2Backend {
            path /oauth2/*
            not path /oauth2/callback /oauth2/callback/*
        }
        handle @oauth2Backend {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /userinfo* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /.well-known/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /connect/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /login* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /logout* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /saml2/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /legal/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /css/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /js/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /images/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }
        handle /fonts/* {
            reverse_proxy http://{{ .Release.Name }}-identity-service:8080
        }

        # Reverse proxy for core APIs (e.g. /api/v2/playground, /api/v1/courses)
        handle /api/* {
            reverse_proxy https://{{ .Release.Name }}-core:443 {
                transport http {
                    tls_insecure_skip_verify
                }
            }
        }

        # Web Shell SPA portal routes (top-level portal host must never be framed)
        handle {
            header {
                X-Frame-Options "DENY"
                Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' http: https: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
            }
            try_files {path} /index.html
            file_server
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web-shell
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web-shell
    spec:
      containers:
      - name: {{ .Release.Name }}-web-shell
        image: {{ include "fbs-web-shell-image" . }}
        imagePullPolicy: {{ .Values.webShell.image.pullPolicy }}
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: {{ .Values.webShell.resources.cpu.request }}
            memory: {{ .Values.webShell.resources.memory.request }}
          limits:
            cpu: {{ .Values.webShell.resources.cpu.limit }}
            memory: {{ .Values.webShell.resources.memory.limit }}
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
      volumes:
      - name: caddy-config
        configMap:
          name: {{ .Release.Name }}-web-shell-caddy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
spec:
  selector:
    app: {{ .Release.Name }}-web-shell
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
{{ if .Values.webShell.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web-shell
  labels:
    app: {{ .Release.Name }}-web-shell
  {{- with .Values.webShell.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.webShell.ingress.className }}
  ingressClassName: {{ .Values.webShell.ingress.className }}
  {{- end }}
  {{- if .Values.webShell.ingress.tls }}
  tls:
    {{- toYaml .Values.webShell.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.webShell.ingress.hosts }}
    {{- range .Values.webShell.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-web-shell
                port:
                  number: 80
        {{- end }}
    {{- end }}
  {{- else }}
    - host: {{ .Values.common.config.hostname | quote }}
      http:
        paths:
          - path: /oauth2/callback
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-shell
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web-shell
                port:
                  number: 80
  {{- end }}
{{ end }}
{{ if .Values.webShell.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-web-shell
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.common.config.hostname }}`)
    kind: Rule
    services:
    - name: {{ .Release.Name }}-web-shell
      port: 80
{{ end }}
{{ end }}
