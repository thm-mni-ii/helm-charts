    enabled: false
    pathPrefix: "/sql-playground"

core:
  enabled: true
  image:
    registry: ghcr.io
    name: thm-mni-ii/fbs-core
    tag: ""
    pullPolicy: "IfNotPresent"
  volumes:
    config:
      size: "8G"
      mode: "ReadWriteOnce"
    uploadDir:
      size: "16G"
      mode: "ReadWriteOnce"
  resources:
    cpu:
      request: 0.1
      limit: 2
    memory:
      request: "250Mi"
      limit: "4Gi"
  probes:
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  config:
    jwtSecret: "2edb8793d987389e1626918e0ec1dbee"  # CHANGE ME
    ldap:
      enabled: false
      allowLogin: false
      baseDn: ""
      url: ""
      startTls: true
      filter: "(uid={user})"
      timeout: 5000
      bind:
        enabled: false
        dn: ""
        password: ""
      attributeNames:
        uid: "uid"
        sn: "sn"
        name: "givenName"
        mail: "mail"
    digitalClassroom:  # Overwritten if digitalClassroom.enabled
      url: "https://bbb.feedback.example.org"
      secret: "1234"
    antiBruteForce:
      trustedProxyCount: 0
      interval: 600
      maxAttempts: 10
      allowList: []
    sqlPlaygroundShare:
      publicHost: "127.0.0.1"
      publicPort: 4321
    id:
      salt: "fbs-helm-chart-salt"  # Change me if you want different ids
    integrations:
      modelling:
        url: "https://fbs-modelling.mni.thm.de/"
    assa:
      url: ""
      secret: ""
    sqlRunner:
      url: ""
      insecure: false
      sharedSecret: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    servicePort: 443
    hosts: []
    #   - host: feedback.example.org
    #     paths:
    #       - path: /api/v1
    #         pathType: Prefix
    #       - path: /results
    #         pathType: Prefix
    tls: []
    #   - secretName: feedback-tls
    #     hosts:
    #       - feedback.example.org
  ingressRoute:
    enabled: false

runner:
  enabled: true
  image:
    registry: ghcr.io
