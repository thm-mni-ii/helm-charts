common:
  config:
    protocol: "https:"
    hostname: feedback.example.org
    port: 443

webShell:
  enabled: true
  image:
    registry: ghcr.io
    name: thm-mni-ii/fbs-web-shell
    tag: ""
    pullPolicy: "IfNotPresent"
  resources:
    cpu:
      request: 0.01
      limit: 1
    memory:
      request: "50Mi"
      limit: "500Mi"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #   - host: feedback.example.org
    #     paths:
    #       - path: /
    #         pathType: Prefix
    tls: []
    #   - secretName: feedback-tls
    #     hosts:
    #       - feedback.example.org
  ingressRoute:
    enabled: false

identity:
  enabled: true
  image:
    registry: ghcr.io
    name: thm-mni-ii/fbs-identity-service
    tag: ""
    pullPolicy: "IfNotPresent"
  resources:
    cpu:
      request: 0.1
      limit: 2
    memory:
      request: "250Mi"
      limit: "4Gi"
  config:
    saml:
      enabled: false
      registrationId: "keycloak"  # e.g. "thm" or "keycloak"
      idpMetadataUri: ""  # e.g. "https://idp.thm.de/idp/shibboleth"
      idpEntityId: ""
      idpSsoUrl: ""
      spEntityId: ""  # Defaults to https://<host>/saml2/metadata/<registrationId> if empty
      principalAttribute: "uid"
      prenameAttribute: "givenName"
      surnameAttribute: "sn"
      emailAttribute: "mail"
      signRequest: false
    oidc:
      issuer: ""  # Overwritten with common host if empty
      jwkSetUri: ""  # Overwritten with internal identity service endpoint if empty
      clientId: "fbs-web-shell,fbs-test-client"
      redirectUris: []
      postLogoutRedirectUris: []
      accessTokenTtlMinutes: 15
      authCodeTtlMinutes: 5
    signingKey:
      existingSecret: ""  # Name of existing secret containing identity-signing-key.p12
      secretKey: "identity-signing-key.p12"
      keystore: ""  # Base64 encoded .p12 keystore file if not using existingSecret
      storePassword: "changeit"  # CHANGE ME
      alias: "identity-signing"
      keyPassword: "changeit"  # CHANGE ME
    antiBruteForce:
      maxFailuresPerIp: 150
      maxFailuresPerIpUser: 15
      windowSeconds: 600
      trustedProxies: 0
      allowList: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #   - host: feedback.example.org
    #     paths:
    #       - path: /oauth2
    #         pathType: Prefix
    tls: []
    #   - secretName: feedback-tls
    #     hosts:
    #       - feedback.example.org
  ingressRoute:
    enabled: false

courseManagementWeb:
  enabled: true
  image:
    registry: ghcr.io
    name: thm-mni-ii/fbs-core-web
    tag: ""
    pullPolicy: "IfNotPresent"
  resources:
